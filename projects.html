<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080d" />
    <meta
      name="description"
      content="Explore the websites and app created by Infinite Byte Studios."
    />
    <title>Our Projects — Infinite Byte Studios</title>
    <!-- Browser tab icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <!-- Apple home-screen icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/images/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body data-page="projects" id="top">
    <div class="site-noise" aria-hidden="true"></div>
    <header id="site-header"></header>

    <main>
      <section class="page-hero section-shell">
        <p class="eyebrow">THE PORTFOLIO / 01—05</p>
        <h1>
          Our work.<br /><span class="gradient-text">Our experiments.</span>
        </h1>
        <p>
          Five projects, different ideas, one shared curiosity for building
          better digital experiences.
        </p>
      </section>

      <section class="section section-shell projects-section">
        <div
          class="filter-bar"
          id="project-filters"
          aria-label="Filter projects"
        >
          <button
            class="filter-button active"
            type="button"
            data-filter="all"
            aria-pressed="true"
          >
            All work <span>05</span>
          </button>
          <button
            class="filter-button"
            type="button"
            data-filter="website"
            aria-pressed="false"
          >
            Websites
          </button>
          <button
            class="filter-button"
            type="button"
            data-filter="app"
            aria-pressed="false"
          >
            Apps
          </button>
        </div>

        <div class="project-grid" id="all-projects" aria-live="polite">
          <p class="loading-message">Loading all projects…</p>
        </div>
        <p class="empty-state" id="empty-projects" hidden>
          No projects match this filter yet.
        </p>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
